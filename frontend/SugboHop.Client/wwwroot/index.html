<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SugboHop</title>
    <base href="/" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="SugboHop.Client.styles.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sugbo: { cyan: '#00BFFF', mint: '#00FFBF', sunrise: '#FF7E5F', dark: '#0F172A', sand: '#F8FAFC' }
                    },
                    fontFamily: {
                        heading: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-sugbo-sand text-sugbo-dark font-sans">
    <div id="app">
        <div class="min-h-screen flex items-center justify-center">
            <span class="font-heading text-xl font-extrabold text-sugbo-cyan animate-pulse">SugboHop…</span>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none" class="fixed bottom-0 inset-x-0 bg-sugbo-sunrise text-sugbo-dark text-sm font-semibold px-6 py-3">
        Something went wrong. <a href="." class="underline">Reload</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
